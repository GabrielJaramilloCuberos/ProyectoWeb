spring.application.name=vigilapp

## Prefer explicit JDBC URL when provided (use Supabase JDBC or DATABASE URL converted to JDBC)
# You can set SPRING_DATASOURCE_URL to a full JDBC connection string (recommended for Supabase)
# Example: jdbc:postgresql://db.abcd.supabase.co:5432/vigilapp_db?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5432}}/${DB_NAME:${POSTGRES_DB:vigilapp_db}}}
spring.datasource.username=${DB_USER:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false
server.port=${PORT:${SPRING_PORT:8080}}
spring.jpa.show-sql=true

# ====================================================================
# HikariCP — Configuración de pool de conexiones para BD remota (Supabase)
# ====================================================================
# Supabase cierra conexiones idle tras ~30 min. Sin estas opciones, HikariCP
# entrega conexiones muertas al código y se rompen con "Unable to commit
# against JDBC Connection". Esta config valida y refresca conexiones
# antes de que mueran.

# Valida la conexión con un SELECT 1 antes de entregarla al código
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# Tiempo máximo de vida de una conexión (28 min, por debajo del timeout de Supabase)
spring.datasource.hikari.max-lifetime=1680000

# Reemplaza conexiones idle después de 10 min
spring.datasource.hikari.idle-timeout=600000

# Envía un keepalive cada 5 min para mantener viva la conexión
spring.datasource.hikari.keepalive-time=300000

# Tamaño del pool (ajustable según necesidad)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

