<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/40 backdrop-blur-sm">
	<div class="w-full max-w-lg max-h-[90vh] overflow-y-auto bg-white rounded-3xl shadow-2xl border border-slate-200">

		<div class="flex items-start justify-between gap-4 p-6 border-b border-slate-100">
			<div>
				<h3 class="text-2xl font-semibold text-slate-900">Reasignar Turno</h3>
				<p class="text-sm text-slate-500">Selecciona un docente disponible para cubrir el turno</p>
			</div>
			<button type="button" (click)="onClose()" [disabled]="loading"
				class="text-slate-400 hover:text-slate-700 text-2xl leading-none disabled:opacity-40">&times;</button>
		</div>

		<div *ngIf="shift" class="space-y-6 p-6">

			<!-- Info del turno -->
			<div class="bg-rose-50 rounded-2xl p-5 border border-rose-200">
				<h4 class="font-semibold text-rose-900 mb-2">{{ shift.zoneName }}</h4>
				<p class="text-sm text-rose-700">
					{{ shift.startTime }} - {{ shift.endTime }} · Docente original: {{ shift.teacherName }}
				</p>
			</div>

			<!-- Lista de docentes -->
			<div class="space-y-2 max-h-80 overflow-y-auto">
				<label class="text-sm font-medium text-slate-700 block mb-3">Docentes Disponibles</label>

				<p *ngIf="filteredTeachers.length === 0" class="text-sm text-slate-500 py-4 text-center">
					No hay otros docentes disponibles.
				</p>

				<button
					type="button"
					*ngFor="let teacher of filteredTeachers"
					(click)="selectedTeacherId = teacher.id"
					[disabled]="loading"
					[class.border-sky-400]="selectedTeacherId === teacher.id"
					[class.bg-sky-50]="selectedTeacherId === teacher.id"
					class="w-full flex items-center gap-4 p-4 bg-white border border-slate-200 hover:border-slate-300 rounded-xl text-left transition-all disabled:opacity-40"
				>
					<div class="w-10 h-10 bg-sky-100 rounded-full flex items-center justify-center flex-shrink-0">
						<span class="text-sky-600 font-semibold">{{ teacher.name.charAt(0) }}</span>
					</div>
					<div class="flex-1 min-w-0">
						<p class="font-medium text-slate-900">{{ teacher.name }}</p>
						<p class="text-sm text-slate-600">{{ teacher.department }}</p>
					</div>
					<span *ngIf="selectedTeacherId === teacher.id" class="text-sky-600 text-lg">✓</span>
				</button>
			</div>

			<!-- Error -->
			<div *ngIf="errorMessage" class="bg-red-50 border border-red-200 rounded-xl p-4 text-sm text-red-700">
				{{ errorMessage }}
			</div>

			<!-- Botones -->
			<div class="flex gap-3 pt-2">
				<button type="button" (click)="onClose()" [disabled]="loading"
					class="flex-1 py-3 px-4 rounded-xl border border-slate-200 text-slate-700 font-medium hover:bg-slate-50 transition disabled:opacity-40">
					Cancelar
				</button>
				<button type="button" (click)="onConfirm()" [disabled]="!selectedTeacherId || loading"
					class="flex-1 py-3 px-4 rounded-xl bg-sky-600 text-white font-medium hover:bg-sky-700 transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
					<svg *ngIf="loading" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
						<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
						<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
					</svg>
					{{ loading ? 'Guardando...' : 'Confirmar Reasignación' }}
				</button>
			</div>
		</div>
	</div>
</div>
