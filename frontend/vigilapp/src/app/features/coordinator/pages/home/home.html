<div class="min-h-screen relative bg-linear-to-br from-slate-50 via-white to-slate-100 text-slate-900">
	<app-coordinator-header
		[autoRefresh]="autoRefresh"
		(back)="onBack()"
		(toggleAutoRefresh)="toggleAutoRefresh()"
	/>

	<!-- Cargando -->
	<div *ngIf="loading" class="flex flex-col items-center justify-center py-32 gap-4">
		<svg class="animate-spin h-10 w-10 text-sky-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
			<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
			<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
		</svg>
		<p class="text-slate-500 text-sm">Cargando datos del dashboard...</p>
	</div>

	<!-- Error -->
	<div *ngIf="!loading && error" class="max-w-lg mx-auto mt-20 px-4">
		<div class="bg-red-50 border border-red-200 rounded-2xl p-8 text-center space-y-4">
			<p class="text-red-700 font-medium">{{ error }}</p>
			<button type="button" (click)="retryLoad()"
				class="px-6 py-2 bg-red-600 text-white rounded-xl hover:bg-red-700 transition text-sm font-medium">
				Reintentar
			</button>
		</div>
	</div>

	<!-- Dashboard -->
	<div *ngIf="!loading && !error" class="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-14 space-y-8 sm:space-y-10">
		<app-coordinator-stats
			[activeShifts]="activeShifts.length"
			[missedShifts]="missedShifts.length"
			[patrolCount]="patrolCount"
			[incidents]="todayIncidents.length"
		/>

		<app-coordinator-alerts
			*ngIf="missedShifts.length > 0"
			[missedShifts]="missedShifts"
			(viewDetails)="viewShiftDetails($event)"
			(reassign)="openReassignDialog($event)"
		/>

		<div class="mt-10 sm:mt-12">
			<app-heatmap />
		</div>

		<app-coordinator-active-shifts
			*ngIf="activeShifts.length > 0"
			[shifts]="activeShifts"
			(shiftSelected)="viewShiftDetails($event)"
		/>

		<app-coordinator-activity-feed
			*ngIf="todayIncidents.length > 0"
			[incidents]="todayIncidents.slice(0, 8)"
		/>
	</div>

	<!-- Dialogo: detalles de turno -->
	<app-coordinator-shift-details-dialog
		*ngIf="selectedShift"
		[shift]="selectedShift"
		(close)="closeShiftDetails()"
		(reassign)="openReassignDialog($event)"
	/>

	<!-- Dialogo: detalles de zona -->
	<app-coordinator-zone-details-dialog
		*ngIf="selectedZoneData"
		[zone]="selectedZoneData"
		[shifts]="selectedZoneShifts"
		[incidents]="selectedZoneIncidents"
		[incidentSummary]="selectedZoneIncidentSummary"
		[currentTeacherName]="selectedZoneTeacherName"
		[currentTeacherLabel]="selectedZoneTeacherLabel"
		(close)="closeZoneDetails()"
	/>

	<!-- Dialogo: reasignación -->
	<app-coordinator-reassign-dialog
		*ngIf="reassignShift"
		[shift]="reassignShift"
		[availableTeachers]="availableTeachers"
		[loading]="reassigning"
		[errorMessage]="reassignError"
		(close)="closeReassignDialog()"
		(confirm)="confirmReassign($event.shift, $event.teacherId)"
	/>
</div>
